        '200': { description: Recommendations }

  /watchfriend/batch:
    post:
      tags: [Watch Friends]
      summary: Batch add friends
      responses:
        '200': { description: Friends added }

  /watchfriend/friendname:
    post:
      tags: [Watch Friends]
      summary: Update friend display name
      responses:
        '200': { description: Name updated }

  /watchfriend/importPhoneBook:
    post:
      tags: [Watch Friends]
      summary: Import friends from phone book
      responses:
        '200': { description: Imported }

  /watchfriend/update/info:
    post:
      tags: [Watch Friends]
      summary: Update friend info
      responses:
        '200': { description: Updated }

  # ── Group Chat ────────────────────────────────────────────────────────────────
  /group-chat/familyGroup/groups:
    get:
      tags: [Group Chat]
      summary: Get family group chat list
      responses:
        '200': { description: Group list }

