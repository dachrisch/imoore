openapi: 3.0.3

info:
  title: imoo Watch API
  description: |
    Reverse-engineered REST API for the **imoo Watch** companion app (`com.imoo.watch.global`).

    **Methodology**: Static analysis of the Android APK (DEX bytecode string extraction).
    HTTP methods are **inferred** from endpoint naming conventions and may not be exact.
    Request/response schemas are not confirmed — placeholders are used where unknown.

    **Services (base URLs)**
    | Service | Host |
    |---|---|
    | Core API | `https://api.watch.okii.com` |
    | Location API | `https://location.watch.okii.com` |
    | Health & Sport | `https://sport.watch.okii.com` |
    | Chat | `https://chat.watch.okii.com` |
    | Points & Rewards | `https://points.okii.com` |
    | CDN | `https://watchcdn.okii.com` |

    **International region** mirrors exist at `*-oz.okii.com` (e.g. `api-oz.okii.com`).

    > ⚠️ This spec is for personal research to add features to a device you own.
    > It is not affiliated with or endorsed by imoo / BBK Electronics.
  version: "unknown"
  contact:
    name: dachrisch
    url: https://github.com/dachrisch/imoo-watch-api

servers:
  - url: https://api.watch.okii.com
    description: Core API (default)
  - url: https://location.watch.okii.com
    description: Location API
  - url: https://sport.watch.okii.com
    description: Health & Sport API
  - url: https://chat.watch.okii.com
    description: Chat API
  - url: https://points.okii.com
    description: Points & Rewards API
  - url: https://watchcdn.okii.com
    description: CDN

tags:
  - name: Authentication
    description: Login, registration, password management, verification
  - name: QR Code Auth
    description: QR-code based login flow
  - name: One-Click Login
    description: Carrier one-click login (Chinese mobile operators)
  - name: Third-Party Auth
    description: Social / third-party account binding
  - name: OAuth
    description: OAuth token exchange
  - name: Watch Account
    description: Watch device account management
  - name: Mobile Account
    description: Guardian (parent) mobile account
  - name: Device Binding
    description: Bind/unbind watch to mobile account
  - name: Genius Accounts
    description: Secondary accounts on the watch (child sub-accounts)
  - name: Contacts
    description: Watch contacts (numbers the watch can call)
  - name: Watch Friends
    description: Friend list management
  - name: Group Chat
    description: Family group chat room
  - name: Alarms
    description: Watch alarm management
  - name: Notifications
    description: Push notification queries
  - name: Find Watch
    description: Remote locate/ring/photo features
  - name: Video Calls
    description: Video and voice call signalling (also on chat.watch.okii.com)
  - name: Class Mode
    description: School class schedule / do-not-disturb
  - name: Watch Functions
    description: Feature toggles — power saving, habits, time management
  - name: Geo Zones
    description: Safe/danger zone geo-fencing
  - name: WiFi Management
    description: Saved WiFi networks on the watch
  - name: App Store
    description: Watch app store and recommendations
  - name: Media & Files
    description: File upload, image, photo, and video transfer tokens
  - name: Version & OTA
    description: Firmware/app update checks
  - name: Payment
    description: In-app payment and data plan management
  - name: Operations & Rewards
    description: Gamification tasks and points
  - name: Social
    description: Social content and user habit tracking
  - name: Time Memory
    description: Time-memory photo/memory service
  - name: Watch Data
    description: Raw watch sensor data upload
  - name: Data Migration
    description: Account and device migration flows
  - name: Logging
    description: Client-side log collection
  - name: Server Config
    description: App configuration and H5 URL resolution
  - name: Watch Settings
    description: Watch-level settings aggregated under /smartwatch/ path prefix
  - name: Location
    x-server: https://location.watch.okii.com
    description: "**Host:** `location.watch.okii.com` — Current location and real-time tracking"
  - name: Trail & Contrail
    x-server: https://location.watch.okii.com
