# ── Shared schemas ────────────────────────────────────────────────────────────
components:
  schemas:
    GenericResponse:
      type: object
      description: Standard API response envelope (schema unconfirmed)
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          description: Payload — structure varies per endpoint
    WatchId:
      type: string
      description: Watch device identifier
    MobileId:
      type: string
      description: Guardian mobile account identifier
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: JWT or opaque token obtained from /app/login2 or /app/tokenLogin

security:
  - BearerToken: []

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:

  # ── Authentication ──────────────────────────────────────────────────────────
  /app/rsakey:
    get:
      tags: [Authentication]
      summary: Get RSA public key
      description: Returns the RSA public key used to encrypt passwords before login.
      security: []
      responses:
        '200': { description: RSA public key, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } }

  /app/login/modes:
    get:
      tags: [Authentication]
      summary: Get available login modes
      security: []
      responses:
        '200': { description: List of supported login modes }

  /app/areaCodeList:
    get:
      tags: [Authentication]
      summary: Get country/area code list for phone registration
      security: []
      responses:
        '200': { description: Area code list }

  /app/checkAccount:
    get:
      tags: [Authentication]
      summary: Check if account exists
      parameters:
        - { name: phone, in: query, schema: { type: string } }
      responses:
        '200': { description: Account existence status }

  /app/passwordStatus:
    get:
      tags: [Authentication]
      summary: Get password status for account
      responses:
        '200': { description: Password status }

  /app/getRandCode:
    post:
      tags: [Authentication]
      summary: Request SMS verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                areaCode: { type: string }
      responses:
        '200': { description: Code sent }

  /app/sendRandCodeV2:
    post:
      tags: [Authentication]
      summary: Request SMS verification code (v2)
      security: []
      responses:
        '200': { description: Code sent }

  /app/checkRandCode:
    post:
      tags: [Authentication]
      summary: Verify SMS code
      responses:
        '200': { description: Code verification result }

  /app/verifyCode:
    post:
      tags: [Authentication]
      summary: Verify code (generic)
      responses:
        '200': { description: Verification result }

  /app/regist:
    post:
      tags: [Authentication]
      summary: Register new account
      security: []
      responses:
        '200': { description: Registration result }

  /app/login2:
    post:
      tags: [Authentication]
      summary: Login with phone + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                password: { type: string, description: RSA-encrypted password }
                areaCode: { type: string }
      responses:
        '200': { description: Login token and account info }

  /app/loginV2:
    post:
      tags: [Authentication]
      summary: Login v2
      security: []
      responses:
        '200': { description: Login token }

  /app/randcodeLogin:
    post:
      tags: [Authentication]
      summary: Login with SMS code
      security: []
      responses:
        '200': { description: Login token }

  /app/tokenLogin:
    post:
      tags: [Authentication]
      summary: Login using existing token
      responses:
        '200': { description: Refreshed token }

  /app/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      responses:
        '200': { description: Logout confirmation }

  /app/verifyToken:
    post:
      tags: [Authentication]
      summary: Verify token validity
      responses:
        '200': { description: Token validity }

  /app/verifyPassword:
    post:
      tags: [Authentication]
      summary: Verify password
      responses:
        '200': { description: Password verification }

  /app/verifyPasswordV2:
    post:
      tags: [Authentication]
      summary: Verify password v2
      responses:
        '200': { description: Password verification }

  /app/verifyWeakPassword:
    post:
      tags: [Authentication]
      summary: Check if password is weak
      responses:
        '200': { description: Password strength result }

  /app/verifyUserPower:
    get:
      tags: [Authentication]
      summary: Verify user permissions
      responses:
        '200': { description: Permission set }

  /app/modifyPassword:
    post:
      tags: [Authentication]
      summary: Change password
      responses:
        '200': { description: Password updated }

  /app/modifyUsername:
    post:
      tags: [Authentication]
      summary: Update display name
      responses:
        '200': { description: Username updated }

  /app/modifyUserPhone:
    post:
      tags: [Authentication]
      summary: Update phone number
      responses:
        '200': { description: Phone updated }

  /app/resetPassword:
    post:
      tags: [Authentication]
      summary: Reset forgotten password
      security: []
      responses:
        '200': { description: Password reset }

  /app/resetPasswordForBindPhone:
    post:
      tags: [Authentication]
      summary: Reset password for bound phone
      security: []
      responses:
        '200': { description: Password reset }

  /app/changeDeviceLogin:
    post:
      tags: [Authentication]
      summary: Login from new device
      responses:
        '200': { description: Device change result }

  /app/changeDeviceRandcodeLogin:
    post:
      tags: [Authentication]
      summary: Login from new device using SMS code
      responses:
        '200': { description: Device change result }

  /app/checkChangeDeviceRandcode:
    post:
      tags: [Authentication]
      summary: Check SMS code for device change
      responses:
        '200': { description: Verification result }

  /app/moveTicket:
    post:
      tags: [Authentication]
      summary: Move login ticket between sessions
      responses:
        '200': { description: Ticket moved }

  /app/deleteAccount:
    delete:
      tags: [Authentication]
      summary: Delete account
      responses:
        '200': { description: Account deleted }

  /app/v2/deleteAccount:
    delete:
      tags: [Authentication]
      summary: Delete account (v2)
      responses:
        '200': { description: Account deleted }

  # ── QR Code Auth ────────────────────────────────────────────────────────────
  /app/qrcode:
    post:
      tags: [QR Code Auth]
      summary: Generate QR code for login
      responses:
        '200': { description: QR code data }

  /app/qrcode/login:
    post:
      tags: [QR Code Auth]
      summary: Poll QR code login status
      responses:
        '200': { description: QR login result }

  /app/qrcode/scan:
    post:
      tags: [QR Code Auth]
      summary: Confirm QR code scan
      responses:
        '200': { description: Scan confirmed }

  /app/qrcode/token:
    get:
      tags: [QR Code Auth]
      summary: Get token from scanned QR code
      responses:
        '200': { description: Auth token }

  # ── One-Click Login ─────────────────────────────────────────────────────────
  /app/oneClick/getServer:
    get:
      tags: [One-Click Login]
      summary: Get one-click login server config
      responses:
        '200': { description: Server config }

  /app/oneClick/getSwitch:
    get:
      tags: [One-Click Login]
      summary: Check if one-click login is available
      responses:
        '200': { description: Switch state }

  /app/oneClick/login:
    post:
      tags: [One-Click Login]
      summary: One-click login
      security: []
      responses:
        '200': { description: Auth token }

  /app/oneClick/loginV2:
    post:
      tags: [One-Click Login]
      summary: One-click login v2
      security: []
      responses:
        '200': { description: Auth token }

  /app/oneClick/regist:
    post:
      tags: [One-Click Login]
      summary: One-click register
      security: []
      responses:
        '200': { description: Registration result }

  /app/oneClick/userToken:
    get:
      tags: [One-Click Login]
      summary: Get user token for one-click flow
      responses:
        '200': { description: User token }

  /app/oneClick/changeDeviceLogin:
    post:
      tags: [One-Click Login]
      summary: One-click login from new device
      responses:
        '200': { description: Device change result }

  # ── Third-Party Auth ─────────────────────────────────────────────────────────
  /app/third/checkAccount:
    get:
      tags: [Third-Party Auth]
      summary: Check if third-party account is linked
      responses:
        '200': { description: Account link status }

  /app/third/bind:
    post:
      tags: [Third-Party Auth]
      summary: Bind third-party account
      responses:
        '200': { description: Bind result }

  /app/third/login:
    post:
      tags: [Third-Party Auth]
      summary: Login via third-party account
      security: []
      responses:
        '200': { description: Auth token }

  /app/third/regist:
    post:
      tags: [Third-Party Auth]
      summary: Register via third-party account
      security: []
      responses:
        '200': { description: Registration result }

  /app/third/rebind:
    post:
      tags: [Third-Party Auth]
      summary: Re-bind third-party account
      responses:
        '200': { description: Rebind result }

  /app/third/delete:
    delete:
      tags: [Third-Party Auth]
      summary: Remove third-party account link
      responses:
        '200': { description: Link removed }

  /app/third/unbind:
    post:
      tags: [Third-Party Auth]
      summary: Unbind third-party account
      responses:
        '200': { description: Unbound }

  # ── OAuth ───────────────────────────────────────────────────────────────────
  /oauth/oauthBind/getWatchId:
    get:
      tags: [OAuth]
      summary: Get watch ID via OAuth binding
      responses:
        '200': { description: Watch ID }

  /oauth/openAccount/getOpenId:
    get:
      tags: [OAuth]
      summary: Get open platform user ID
      responses:
        '200': { description: Open ID }

  # ── Watch Account ────────────────────────────────────────────────────────────
  /watchaccount:
    get:
      tags: [Watch Account]
      summary: Get watch account details
      responses:
        '200': { description: Watch account info }

  /watchaccount/id/{watchId}:
    get:
      tags: [Watch Account]
      summary: Get watch account by watch ID
      parameters:
        - { name: watchId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Watch account }

  /watchaccount/getAuthorize:
    get:
      tags: [Watch Account]
      summary: Get watch authorizations
      responses:
        '200': { description: Authorization list }

  /watchaccount/4G/getAuthorize:
    get:
      tags: [Watch Account]
      summary: Get 4G data authorizations
      responses:
        '200': { description: 4G authorization }

  /watchaccount/remote/search:
    get:
      tags: [Watch Account]
      summary: Remote search for watch account
      responses:
        '200': { description: Search result }

  /watchaccount/soundMode/{watchId}:
    get:
      tags: [Watch Account]
      summary: Get watch sound mode
      parameters:
        - { name: watchId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Sound mode }

  /watchaccount/authorizeSwitch:
    post:
      tags: [Watch Account]
      summary: Toggle authorization
      responses:
        '200': { description: Switch updated }

  /watchaccount/classdisabled:
    post:
      tags: [Watch Account]
      summary: Set class mode disabled state
      responses:
        '200': { description: Updated }

  /watchaccount/updateBabyName:
    post:
      tags: [Watch Account]
      summary: Update child's name on watch
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                watchId: { type: string }
                babyName: { type: string }
      responses:
        '200': { description: Name updated }

  /watchaccount/updateRealName:
    post:
      tags: [Watch Account]
      summary: Update real-name verification
      responses:
        '200': { description: Updated }

  /watchaccount/update/watchAttribute:
    post:
      tags: [Watch Account]
      summary: Update watch attributes
      responses:
        '200': { description: Attributes updated }

  /watchaccount/soundMode/setSoundMode:
    post:
      tags: [Watch Account]
      summary: Set watch sound mode
      responses:
        '200': { description: Sound mode set }

  # ── Mobile Account ───────────────────────────────────────────────────────────
  /mobileaccount:
    get:
      tags: [Mobile Account]
      summary: Get guardian mobile account info
      responses:
        '200': { description: Mobile account }

  /mobileaccount/id/{mobileId}:
    get:
      tags: [Mobile Account]
      summary: Get mobile account by ID
      parameters:
        - { name: mobileId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Mobile account }

  /mobileinit/authid:
    get:
      tags: [Mobile Account]
      summary: Get auth ID for mobile init
      responses:
        '200': { description: Auth ID }

  /mobileoperator/charge/latest:
    get:
      tags: [Mobile Account]
      summary: Get latest data plan charge info
      responses:
        '200': { description: Charge info }

  # ── Device Binding ───────────────────────────────────────────────────────────
  /mobilewatch:
    get:
      tags: [Device Binding]
      summary: Get all bound watches for mobile account
      responses:
        '200': { description: Bound watches list }

  /mobilewatch/{id}:
    get:
      tags: [Device Binding]
      summary: Get mobile-watch binding by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Binding info }

  /mobilewatch/mobile/{mobileId}:
    get:
      tags: [Device Binding]
      summary: Get watches bound to mobile ID
      parameters:
        - { name: mobileId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Bound watches }

  /mobilewatch/watch/{watchId}:
    get:
      tags: [Device Binding]
      summary: Get mobile accounts bound to watch
      parameters:
        - { name: watchId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Bound mobiles }

  /mobilewatch/changeadmin:
    post:
      tags: [Device Binding]
      summary: Transfer admin role to another guardian
      responses:
        '200': { description: Admin transferred }

  # ── Genius Accounts ──────────────────────────────────────────────────────────
  /geniusAccount:
    get:
      tags: [Genius Accounts]
      summary: List genius (secondary) accounts
      responses:
        '200': { description: Account list }

  /geniusAccount/delete/{id}:
    delete:
      tags: [Genius Accounts]
      summary: Delete genius account
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /geniusAccount/batchDelete:
    delete:
      tags: [Genius Accounts]
      summary: Batch delete genius accounts
      responses:
        '200': { description: Deleted }

  /geniusAccount/settingPassword:
    post:
      tags: [Genius Accounts]
      summary: Set password for genius account
      responses:
        '200': { description: Password set }

  /geniusAccount/updateGeniusIcon:
    post:
      tags: [Genius Accounts]
      summary: Update genius account avatar
      responses:
        '200': { description: Icon updated }

  /geniusAccount/updateNumber:
    post:
      tags: [Genius Accounts]
      summary: Update genius account phone number
      responses:
        '200': { description: Number updated }

  # ── Contacts ─────────────────────────────────────────────────────────────────
  /contact/{watchId}:
    get:
      tags: [Contacts]
      summary: Get contacts for watch
      parameters:
        - { name: watchId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Contact list }

  /contact/batch/add:
    post:
      tags: [Contacts]
      summary: Add multiple contacts
      responses:
        '200': { description: Contacts added }

  /contact/del/{id}:
    delete:
      tags: [Contacts]
      summary: Delete contact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /contact/sort:
    post:
      tags: [Contacts]
      summary: Reorder contact list
      responses:
        '200': { description: Sorted }

  /contact/update/info:
    post:
      tags: [Contacts]
      summary: Update contact info
      responses:
        '200': { description: Updated }

  /contact/up/types:
    post:
      tags: [Contacts]
      summary: Update contact type/category
      responses:
        '200': { description: Types updated }

  /contact/contactParentReview:
    post:
      tags: [Contacts]
      summary: Parent review of contact change request
      responses:
