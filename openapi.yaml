      tags: [Contacts]
      summary: Get auto-call dual SIM switch state
      responses:
        '200': { description: Switch state }

  /contact/autocall/remindWatch:
    post:
      tags: [Contacts]
      summary: Remind watch to update auto-call setting
      responses:
        '200': { description: Reminder sent }

  # ── Watch Friends ─────────────────────────────────────────────────────────────
